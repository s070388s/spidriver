[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spidriver"
dynamic = ["version"]
description = "USB SPI interface for SPIDriver, SPIDriver2, and SPIDriverQ"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "James Bowman", email = "jamesb@excamera.com"}]
dependencies = ["pyserial>=3.5"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://spidriver.com"
Documentation = "https://spidriver.readthedocs.io/en/latest/"
Source = "https://github.com/jamesbowman/spidriver"

[project.optional-dependencies]
docs = ["sphinx>=7", "sphinx-rtd-theme>=2"]

[tool.setuptools]
py-modules = ["spidriver"]

[tool.setuptools.dynamic]
version = {attr = "spidriver.__version__"}

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
