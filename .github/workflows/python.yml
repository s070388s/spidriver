name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./python
      - run: python -m unittest discover -s python/tests -v
      - run: python -O -m unittest discover -s python/tests

  package-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install './python[docs]' build
      - run: python -m build python
      - run: python -m sphinx -W -b html python/docs python/docs/_build/html

  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C c -f linux/Makefile
